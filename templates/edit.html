{% extends "base.html" %}

{% block title %}Edit Task{% endblock title %}

{% block body %}
<div class="container">

   <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
         <label for="exampleInputEmail1" class="form-label">Title</label>
         <input type="text" name="title" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" value={{task.title}}>
      </div>
      <div class="form-floating">
         <textarea class="form-control" name="description" id="floatingTextarea">{{task.description}}</textarea>
         <label for="floatingTextarea">Description</label>
      </div>

         <button type="submit" class="btn btn-primary">Update</button>
      </form>

</div>
{% endblock body %}
